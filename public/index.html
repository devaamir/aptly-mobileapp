<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"
    />

    <!-- ─── Primary SEO ─────────────────────────────────────────────────── -->
    <title>Aptly – Book Doctor &amp; Clinic Appointments Near You</title>
    <meta
      name="description"
      content="Find and book appointments with top doctors and clinics near you. Search by specialty — cardiologist, dermatologist, dentist, and more. Instant confirmation, real-time token tracking."
    />
    <meta
      name="keywords"
      content="clinic near me, doctor near me, book doctor appointment, cardiologist near me, dermatologist near me, dentist near me, pediatrician near me, hospital near me, online doctor booking, Aptly, Aptly Care"
    />
    <link rel="canonical" href="https://app.aptly.care/" />

    <!-- ─── Open Graph / Facebook ────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aptly" />
    <meta property="og:title" content="Aptly – Book Doctor &amp; Clinic Appointments Near You" />
    <meta
      property="og:description"
      content="Find clinics and doctors near you. Book appointments in seconds with real-time token tracking. Cardiologists, dermatologists, dentists, and more."
    />
    <meta property="og:url" content="https://app.aptly.care/" />
    <meta property="og:image" content="https://app.aptly.care/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_IN" />

    <!-- ─── Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aptly – Book Doctor &amp; Clinic Appointments Near You" />
    <meta
      name="twitter:description"
      content="Find clinics and doctors near you. Book appointments in seconds with real-time token tracking."
    />
    <meta name="twitter:image" content="https://app.aptly.care/icon-512.png" />

    <!-- ─── Geo / Local SEO ───────────────────────────────────────────────── -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="ICBM" content="20.5937, 78.9629" />

    <!-- ─── PWA / Theme ──────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aptly" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ─── Robots ───────────────────────────────────────────────────────── -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- ─── Global Structured Data (WebSite + Organization) ─────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://app.aptly.care/#organization",
          "name": "Aptly",
          "url": "https://app.aptly.care",
          "logo": {
            "@type": "ImageObject",
            "url": "https://app.aptly.care/icon-512.png",
            "width": 512,
            "height": 512
          },
          "sameAs": [],
          "description": "Aptly is a healthcare appointment booking platform. Find doctors and clinics near you, book appointments instantly, and track your token in real time."
        },
        {
          "@type": "WebSite",
          "@id": "https://app.aptly.care/#website",
          "url": "https://app.aptly.care",
          "name": "Aptly",
          "description": "Book doctor and clinic appointments near you",
          "publisher": { "@id": "https://app.aptly.care/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://app.aptly.care/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          },
          "inLanguage": "en-IN"
        }
      ]
    }
    </script>

    <!-- ─── Prerender.io: hold snapshot until app signals ready ────────── -->
    <script>window.prerenderReady = false;</script>

    <!-- ─── Fonts ─────────────────────────────────────────────────────────── -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        background: #fff;
      }

      #root {
        height: 100%;
        width: 100%;
        max-width: 450px;
        margin: 0 auto;
        background: #fff;
        overflow: hidden;
      }

      @media (min-width: 768px) {
        #root {
          max-width: 100%;
        }
      }

      #root {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        height: 100%;
      }

      svg {
        flex-shrink: 0;
        overflow: hidden;
      }

      @font-face {
        font-family: 'Manrope-Regular';
        src: url('/fonts/Manrope-Regular.ttf');
      }

      @font-face {
        font-family: 'Manrope-Light';
        src: url('/fonts/Manrope-Light.ttf');
      }

      @font-face {
        font-family: 'Manrope-ExtraLight';
        src: url('/fonts/Manrope-ExtraLight.ttf');
      }

      @font-face {
        font-family: 'Manrope-Medium';
        src: url('/fonts/Manrope-Medium.ttf');
      }

      @font-face {
        font-family: 'Manrope-SemiBold';
        src: url('/fonts/Manrope-SemiBold.ttf');
      }

      @font-face {
        font-family: 'Manrope-Bold';
        src: url('/fonts/Manrope-Bold.ttf');
      }

      @font-face {
        font-family: 'Manrope-ExtraBold';
        src: url('/fonts/Manrope-ExtraBold.ttf');
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="recaptcha-container"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
